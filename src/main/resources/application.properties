# ===================================================================
# NOMBRE DE LA APLICACIÓN
# ===================================================================
# Identifica la aplicación en logs y en herramientas de monitoreo.
spring.application.name=MiPrimerSpringboot

# ===================================================================
# CONEXIÓN A BASE DE DATOS MYSQL
# ===================================================================
# URL de conexión: jdbc:mysql://<host>:<puerto>/<nombre_bd>?parametros
#   useSSL=false              → no usar cifrado SSL en conexión local
#   allowPublicKeyRetrieval   → permite recuperar la clave pública del servidor MySQL
#   serverTimezone=UTC        → evita errores de zona horaria con fechas
spring.datasource.url=jdbc:mysql://localhost:3306/escuela_kenpo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Credenciales de MySQL. En producción estas se pondrían en variables de entorno.
spring.datasource.username=root
spring.datasource.password=v1ss1921

# Driver JDBC de MySQL (clase Java que sabe hablar con MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE — MAPEO OBJETO-RELACIONAL
# ===================================================================
# Estrategia de gestión del esquema de BD al iniciar la aplicación:
#   create      → BORRA y recrea las tablas (útil en desarrollo inicial)
#   create-drop → igual que create pero borra al cerrar
#   update      → actualiza las tablas sin borrar datos existentes
#   validate    → solo valida que el esquema coincide, no modifica nada
#   none        → no hace nada (para producción con esquema manual)
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que genera Hibernate para cada operación.
# Muy útil para aprender qué queries hace Spring Data JPA internamente.
spring.jpa.show-sql=true

# Formatea el SQL con saltos de línea para que sea más legible en la consola.
spring.jpa.properties.hibernate.format_sql=true

# Fuerza a Hibernate a usar exactamente los nombres de columna definidos en las entidades
# (@Column(name = "fecha_nac"), @Table(name = "personas"), etc.)
# Sin esto, Hibernate podría transformar los nombres y causar errores de columna no encontrada.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Dialecto de MySQL que Hibernate debe usar para generar SQL compatible.
# MySQLDialect es el recomendado para MySQL 8+.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# THYMELEAF — MOTOR DE PLANTILLAS HTML
# ===================================================================
# Desactiva el caché de plantillas durante el desarrollo.
# Con cache=false, cada petición lee el archivo HTML fresco desde disco.
# En producción se debe cambiar a true para mejorar el rendimiento.
spring.thymeleaf.cache=false

# Codificación de caracteres para las vistas HTML (necesario para tildes y ñ).
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# CODIFICACIÓN HTTP — TILDES Y CARACTERES ESPECIALES
# ===================================================================
# Garantiza que el servidor Tomcat use UTF-8 para leer y enviar datos.
# Sin esto, las tildes (á, é, ñ) pueden aparecer como caracteres extraños.
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# ===================================================================
# GESTIÓN DE SESIÓN Y COOKIES DE SEGURIDAD
# ===================================================================
# Tiempo de vida de la sesión del usuario en el navegador.
# Después de 30 minutos de inactividad, la sesión expira y debe volver a hacer login.
server.servlet.session.timeout=30m

# Nombre personalizado de la cookie de sesión (en vez del genérico "JSESSIONID").
# Ayuda a identificar las cookies de este sistema específico.
server.servlet.session.cookie.name=KENPOSESSION

# HttpOnly=true impide que JavaScript del navegador lea la cookie de sesión.
# Protege contra ataques XSS (Cross-Site Scripting) que intentan robar la sesión.
server.servlet.session.cookie.http-only=true

# SameSite=lax limita el envío de la cookie solo a peticiones del mismo sitio.
# Protege parcialmente contra ataques CSRF (Cross-Site Request Forgery).
server.servlet.session.cookie.same-site=lax

# Secure=true solo enviaría la cookie sobre conexiones HTTPS.
# En false para desarrollo local (HTTP). En producción cambiar a true.
server.servlet.session.cookie.secure=false
