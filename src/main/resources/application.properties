spring.application.name=MiPrimerSpringboot

# ===================================================================
# ?? CONEXION DE BASE DE DATOS (Mantenida con tus credenciales)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/escuela_kenpo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=v1ss1921
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# ? JPA / HIBERNATE (Corregido y Asegurado para Estrategia JOINED)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORREGIDO: Fuerza a Hibernate a usar exactamente los nombres definidos en el Script SQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Dialecto moderno recomendado para asegurar compatibilidad de tipos temporales (LocalDate) con MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# ? VISTAS THYMELEAF Y CONTROL DE CARACTERES (Tildes y Ñ)
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# CORREGIDO: Evita que Tomcat rompa palabras con tildes"
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true