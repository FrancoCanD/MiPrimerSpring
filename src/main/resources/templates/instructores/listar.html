<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo de Instructores — Kenpo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<br>
<header th:replace="~{fragments/header :: estilos-globales}"></header>
<header th:insert="~{fragments/header :: menu-navegacion}"></header>
<br><br>
<div class="container vista instructores">
<div class="container">
    <div class="header-section">
        <h1>Cuerpo de Instructores</h1>
        <div>
            <a th:href="@{/}" class="btn-inicio">🏠 Menú Principal</a>
            <!-- Solo ADMIN puede crear instructores -->
            <a sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')"
               th:href="@{/instructores/nuevo}" class="btn-crear">➕ Nuevo Instructor</a>
        </div>
    </div>

    <table th:if="${not #lists.isEmpty(instructores)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre Instructor</th>
            <th>RUT</th>
            <th>Rango Actual</th>
            <th>Especialidad Técnica</th>
            <th>Fecha Ingreso</th>
            <th>Experiencia</th>
            <th>Estado</th>
            <!-- Columna acciones solo para ADMIN -->
            <th sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inst : ${instructores}">
            <td th:text="${inst.id}"></td>
            <td class="nombre-negrita" th:text="|Sensei ${inst.nombres} ${inst.apellido1}|"></td>
            <td th:text="${inst.rut}"></td>
            <td th:text="${inst.grado != null ? inst.grado.nombre : 'Sin Grado'}"></td>
            <td class="nombre-verde" th:text="${inst.especialidad}"></td>
            <td th:text="${inst.fechaInicio}"></td>
            <td th:text="${inst.anosExperiencia != null ? inst.anosExperiencia + ' años' : '0'}"></td>
            <td>
                <span th:class="${inst.activo} ? 'badge badge-activa' : 'badge badge-inactiva'"
                      th:text="${inst.activo} ? 'Activo' : 'Licencia'">
                </span>
            </td>
            <!-- Solo ADMIN puede editar y eliminar instructores -->
            <td class="actions-cell" sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')">
                <a th:href="@{/instructores/editar/{id}(id=${inst.id})}" class="link-editar">Editar Ficha</a>
                <a th:href="@{/instructores/eliminar/{id}(id=${inst.id})}"
                   class="link-eliminar"
                   onclick="return confirm('¿Dar de baja esta ficha de instructor?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-msg" th:if="${#lists.isEmpty(instructores)}">
        ℹ️ No existen instructores registrados en la nómina.
    </div>
</div>
<br><br>
<div th:insert="~{fragments/footer :: pie-pagina}"></div>
</div>
</body>
</html>
