<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo de Profesores — Kenpo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1e293b; margin: 0; font-size: 1.8rem; }

        .btn-crear { padding: 10px 18px; background-color: #10b981; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background-color 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .btn-crear:hover { background-color: #059669; }
        .btn-inicio { padding: 10px 18px; background-color: white; color: #475569; text-decoration: none; border-radius: 6px; font-weight: 600; border: 1px solid #cbd5e1; transition: all 0.2s; font-size: 0.95rem; }
        .btn-inicio:hover { background-color: #f8fafc; border-color: #94a3b8; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        th { background-color: #1e293b; color: white; text-align: left; padding: 14px 18px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-activa { background-color: #d1fae5; color: #065f46; }
        .badge-inactiva { background-color: #e2e8f0; color: #475569; }

        .actions-cell a { text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
        .link-editar { color: #10b981; margin-right: 12px; }
        .link-editar:hover { color: #059669; text-decoration: underline; }
        .link-eliminar { color: #ef4444; }
        .link-eliminar:hover { color: #b91c1c; text-decoration: underline; }

        .empty-msg { text-align: center; padding: 30px; background: white; border-radius: 10px; color: #64748b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Cuerpo de Instructores</h1>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/}" class="btn-inicio">🏠 Menú Principal</a>
            <a th:href="@{/instructores/nuevo}" class="btn-crear">➕ Nuevo Profesor</a>
        </div>
    </div>

    <table th:if="${not #lists.isEmpty(instructores)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre Instructor</th>
            <th>RUT</th>
            <th>Rango Actual</th>
            <th>Especialidad Técnica</th>
            <th>Fecha Ingreso</th>
            <th>Experiencia</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inst : ${instructores}">
            <td th:text="${inst.id}" style="font-weight:600; color:#64748b;"></td>
            <td th:text="|Sensei ${inst.nombres} ${inst.apellido1}|" style="font-weight:600; color:#1e293b;"></td>
            <td th:text="${inst.rut}"></td>
            <td th:text="${inst.grado != null ? inst.grado.nombre : 'Sin Grado'}"></td>
            <td th:text="${inst.especialidad}" style="font-weight:500; color:#047857;"></td>
            <td th:text="${inst.fechaInicio}"></td>
            <td th:text="${inst.anosExperiencia != null ? inst.anosExperiencia + ' años' : '0'}"></td>
            <td>
                <span th:class="${inst.activo} ? 'badge badge-activa' : 'badge badge-inactiva'"
                      th:text="${inst.activo} ? 'Activo' : 'Licencia'">
                </span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/instructores/editar/{id}(id=${inst.id})}" class="link-editar">Editar Ficha</a>
                <a th:href="@{/instructores/eliminar/{id}(id=${inst.id})}" class="link-eliminar" onclick="return confirm('¿Dar de baja esta ficha de instructor?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-msg" th:if="${#lists.isEmpty(instructores)}">
        ℹ️ No existen instructores registrados en la nómina.
    </div>
</div>

</body>
</html>
