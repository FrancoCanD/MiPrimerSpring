<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencias — Kenpo</title>
    <th:block th:replace="~{fragments/footer :: estilos-globales}"></th:block>

</head>
<body>

<div class="container">
    <div class="header-section">
        <div>
            <h1>Registro Histórico de Asistencias</h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/}" class="btn-inicio">🏠 Menú Principal</a>
            <a th:href="@{/asistencias/nuevo}" class="btn-crear">📝 Nueva Asistencia</a>
        </div>
    </div>

    <div th:if="${exito}" class="alert alert-success">✅ <span th:text="${exito}"></span></div>
    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>

    <table th:if="${not #lists.isEmpty(listaAsistencias)}">
        <thead>
        <tr>
            <th style="width: 70px;">ID</th>
            <th style="width: 140px;">Fecha Clase</th>
            <th>Estudiante</th>
            <th>Instructor a Cargo</th>
            <th style="width: 160px;">Módulo Técnico</th>
            <th style="width: 180px;">Registro en Sistema</th>
            <th style="width: 140px; text-align: center;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asistencia : ${listaAsistencias}">
            <td th:text="${asistencia.id}" class="id-cell"></td>
            <td>
                <span th:text="${asistencia.fechaClase}" class="date-badge"></span>
            </td>
            <td th:text="|${asistencia.estudiante.nombres} ${asistencia.estudiante.apellido1}|" class="student-cell"></td>
            <td th:text="|Sensei ${asistencia.instructor.nombres} ${asistencia.instructor.apellido1}|" class="instructor-cell"></td>
            <td>
                <span th:text="${asistencia.clase.tipoClase}" class="class-tag"></span>
            </td>
            <td th:text="${#temporals.format(asistencia.registro, 'dd-MM-yyyy HH:mm')}" style="color: #64748b; font-size: 0.9rem;"></td>
            <td class="actions-cell" style="text-align: center;">
                <a th:href="@{/asistencias/editar/{id}(id=${asistencia.id})}" class="link-editar">Editar</a>
                <a th:href="@{/asistencias/eliminar/{id}(id=${asistencia.id})}"
                   class="link-eliminar"
                   onclick="return confirm('¿Seguro que deseas eliminar permanentemente este registro de asistencia?')">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-msg" th:if="${#lists.isEmpty(listaAsistencias)}">
        ℹ️ No se registran asistencias archivadas en la base de datos actualmente.
    </div>
</div>
<br>
<br>
<div th:replace="~{fragments/footer :: pie-pagina}"></div>
</body>
</html>
