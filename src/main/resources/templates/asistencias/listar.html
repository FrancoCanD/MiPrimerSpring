<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Asistencias</title>
</head>
<body>
<h1>Registro de Asistencias Kenpo</h1>
<p><a th:href="@{/asistencias/nuevo}">Registrar nueva asistencia</a></p>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Fecha Clase</th>
        <th>Estudiante</th>
        <th>Instructor a Cargo</th> <!-- Nueva Columna -->
        <th>Tipo de Clase</th>
        <th>Fecha/Hora Registro</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="asistencia : ${listaAsistencias}">
        <td th:text="${asistencia.id}"></td>
        <td th:text="${asistencia.fechaClase}"></td>
        <td th:text="|${asistencia.estudiante.nombres} ${asistencia.estudiante.apellido1}|"></td>
        <!-- Muestra los datos heredados del Instructor a través de Persona -->
        <td th:text="|Sensei ${asistencia.instructor.nombres} ${asistencia.instructor.apellido1}|"></td>
        <td th:text="${asistencia.clase.tipoClase}"></td>
        <td th:text="${asistencia.registro}"></td>
        <td>
            <a th:href="@{/asistencias/editar/{id}(id=${asistencia.id})}">Editar</a> |
            <a th:href="@{/asistencias/eliminar/{id}(id=${asistencia.id})}" onclick="return confirm('¿Eliminar registro?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
<p th:if="${#lists.isEmpty(listaAsistencias)}">No hay registros de asistencia en la base de datos.</p>
<br>
<br>
<a th:href="@{/}">Volver al Inicio</a>

</body>
</html>
