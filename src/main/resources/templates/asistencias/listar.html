<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencias — Kenpo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<br>
<header th:insert="~{fragments/header :: estilos-globales}"></header>
<header th:insert="~{fragments/header :: menu-navegacion}"></header>
<br><br>
<div class="container-vista-asistencia">
<div class="container">
    <div class="header-section">
        <div>
            <h1>Registro Histórico de Asistencias</h1>
        </div>
        <div>
            <a th:href="@{/}" class="btn-inicio">🏠 Menú Principal</a>
            <!-- ADMIN e INSTRUCTOR pueden registrar asistencias -->
            <a sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN','ROL_INSTRUCTOR')"
               th:href="@{/asistencias/nuevo}" class="btn-crear">📝 Nueva Asistencia</a>
        </div>
    </div>

    <div th:if="${exito}" class="alert alert-success">✅ <span th:text="${exito}"></span></div>
    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>

    <table th:if="${not #lists.isEmpty(listaAsistencias)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Fecha Clase</th>
            <th>Estudiante</th>
            <th>Instructor a Cargo</th>
            <th>Módulo Técnico</th>
            <th>Registro en Sistema</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asistencia : ${listaAsistencias}">
            <td th:text="${asistencia.id}" class="id-cell"></td>
            <td>
                <span th:text="${asistencia.fechaClase}" class="date-badge"></span>
            </td>
            <td class="nombre-negrita">
                <span th:text="|${asistencia.estudiante.nombres} ${asistencia.estudiante.apellido1}|" class="student-cell"></span>
            </td>
            <td th:text="|Sensei ${asistencia.instructor.nombres} ${asistencia.instructor.apellido1}|" class="instructor-cell"></td>
            <td>
                <span th:text="${asistencia.clase.tipoClase}" class="class-tag"></span>
            </td>
            <td class="fecha-tono" th:text="${#temporals.format(asistencia.registro, 'dd-MM-yyyy HH:mm')}"></td>
            <td class="actions-cell">
                <!-- Editar: ADMIN e INSTRUCTOR -->
                <a sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN','ROL_INSTRUCTOR')"
                   th:href="@{/asistencias/editar/{id}(id=${asistencia.id})}" class="link-editar">Editar</a>
                <!-- Eliminar: solo ADMIN -->
                <a sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')"
                   th:href="@{/asistencias/eliminar/{id}(id=${asistencia.id})}"
                   class="link-eliminar"
                   onclick="return confirm('¿Seguro que deseas eliminar permanentemente este registro de asistencia?')">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-msg" th:if="${#lists.isEmpty(listaAsistencias)}">
        ℹ️ No se registran asistencias archivadas en la base de datos actualmente.
    </div>
</div>
</div>
<br><br>
<div th:insert="~{fragments/footer :: pie-pagina}"></div>
</body>
</html>
