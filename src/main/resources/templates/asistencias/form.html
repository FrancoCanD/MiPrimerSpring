<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Asistencia — Kenpo</title>
    <link rel="stylesheet" th:href="@{/css/style-form-asistencia.css}">
</head>
<body>
<div class="main-container">
    <h2>Módulo de Asistencias</h2>
    <h3 th:text="${asistencia.id == null} ? 'Registrar Nueva Asistencia' : 'Modificar Asistencia #' + ${asistencia.id}"></h3>

    <div class="form-card">
        <form th:action="@{/asistencias/guardar}" method="post" id="formAsistencia">
            <input type="hidden" name="id" th:value="${asistencia.id}" />

            <!-- Selector de Estudiante -->
            <div class="form-group">
                <label for="estudianteId">Estudiante *</label>
                <select name="estudianteId" id="estudianteId" required>
                    <option value="">— Seleccione un alumno —</option>
                    <option th:each="est : ${listaEstudiantes}"
                            th:value="${est.id}"
                            th:text="|${est.nombres} ${est.apellido1}|"
                            th:selected="${asistencia.estudiante != null and asistencia.estudiante.id == est.id}">
                    </option>
                </select>
            </div>

            <!-- NUEVO: Selector de Instructor -->
            <div class="form-group">
                <label for="instructorId">Instructor a Cargo *</label>
                <select name="instructorId" id="instructorId" required>
                    <option value="">— Seleccione el Instructor —</option>
                    <option th:each="inst : ${listaInstructores}"
                            th:value="${inst.id}"
                            th:text="|Sensei ${inst.nombres} ${inst.apellido1} (${inst.especialidad})|"
                            th:selected="${asistencia.instructor != null and asistencia.instructor.id == inst.id}">
                    </option>
                </select>
            </div>

            <!-- Selector de Clase -->
            <div class="form-group">
                <label for="claseId">Clase Asignada *</label>
                <select name="claseId" id="claseId" required>
                    <option value="">— Seleccione una clase —</option>
                    <option th:each="cl : ${listaClases}"
                            th:value="${cl.id}"
                            th:text="|${cl.tipo_clase} — Cód: ${cl.id}|"
                            th:selected="${asistencia.clase != null and asistencia.clase.id == cl.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaClase">Fecha de la Clase *</label>
                <input type="date" name="fechaClase" id="fechaClase" th:value="${asistencia.fechaClase}" required />
            </div>

            <div class="form-group">
                <label for="registro">Fecha / Hora de Registro *</label>
                <input type="datetime-local" name="registro" id="registro" th:value="${asistencia.registro}" required />
            </div>

            <div class="form-actions">
                <a th:href="@{/asistencias}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-guardar">Guardar Registro</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const regInput = document.getElementById('registro');
        if (regInput && !regInput.value) {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            regInput.value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        }
    });
</script>
</body>
</html>
