<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${asistencia.id == null} ? 'Nueva Asistencia — Kenpo' : 'Editar Asistencia — Kenpo'"></title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; color: #333; }
        .main-container { max-width: 650px; margin: 0 auto; }
        .breadcrumb { margin-bottom: 20px; }
        .breadcrumb a { color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .breadcrumb a:hover { color: #8b5cf6; }
        h2 { color: #1e293b; margin: 0 0 5px 0; }
        h3 { color: #8b5cf6; font-size: 1.1rem; margin: 0 0 30px 0; text-transform: uppercase; letter-spacing: 0.5px; }

        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; font-size: 0.95rem; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }

        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-top: 4px solid #8b5cf6; }
        .info-registro { background-color: #f8fafc; border-left: 4px solid #3b82f6; padding: 15px; border-radius: 6px; margin-bottom: 25px; color: #475569; font-size: 0.9rem; line-height: 1.5; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-weight: 600; color: #1e293b; margin-bottom: 8px; font-size: 0.95rem; }
        label .required { color: #ef4444; }

        select, input[type="date"], input[type="datetime-local"] { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; color: #333; background-color: white; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit; }
        select:focus, input[type="date"]:focus, input[type="datetime-local"]:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }

        .form-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .btn-cancelar { padding: 10px 20px; background-color: #e2e8f0; color: #475569; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background-color 0.2s; font-size: 0.95rem; }
        .btn-cancelar:hover { background-color: #cbd5e1; }
        .btn-guardar { padding: 10px 20px; background-color: #8b5cf6; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; font-size: 0.95rem; }
        .btn-guardar:hover { background-color: #7c3aed; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="breadcrumb">
        <a th:href="@{/asistencias/listar}">← Volver al listado</a>
    </div>

    <h2>Módulo de Asistencias</h2>
    <h3 th:text="${asistencia.id == null} ? 'Registrar Nueva Asistencia' : 'Modificar Asistencia #' + ${asistencia.id}"></h3>

    <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>
    <div th:if="${exito}" class="alert alert-success">✅ <span th:text="${exito}"></span></div>

    <div class="form-card">
        <div class="info-registro" th:if="${asistencia.id == null}">
            <strong>ℹ️ Asignación de bitácora</strong><br>
            Asegúrese de vincular correctamente al alumno con la clase técnica y el instructor encargado que dictó la cátedra.
        </div>

        <form th:action="@{/asistencias/guardar}" method="post" id="formAsistencia">
            <input type="hidden" name="id" th:value="${asistencia.id}" />

            <div class="form-group">
                <label for="estudianteId">Estudiante <span class="required">*</span></label>
                <select name="estudianteId" id="estudianteId" required>
                    <option value="">— Seleccione un alumno —</option>
                    <option th:each="est : ${listaEstudiantes}"
                            th:value="${est.id}"
                            th:text="|${est.nombres} ${est.apellido1}|"
                            th:selected="${asistencia.estudiante != null and asistencia.estudiante.id == est.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="instructorId">Instructor a Cargo <span class="required">*</span></label>
                <select name="instructorId" id="instructorId" required>
                    <option value="">— Seleccione el Instructor —</option>
                    <option th:each="inst : ${listaInstructores}"
                            th:value="${inst.id}"
                            th:text="|Sensei ${inst.nombres} ${inst.apellido1} (${inst.especialidad})|"
                            th:selected="${asistencia.instructor != null and asistencia.instructor.id == inst.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="claseId">Clase Asignada <span class="required">*</span></label>
                <select name="claseId" id="claseId" required>
                    <option value="">— Seleccione una clase —</option>
                    <option th:each="cl : ${listaClases}"
                            th:value="${cl.id}"
                            th:text="|${cl.tipoClase} — Cód: ${cl.id}|"
                            th:selected="${asistencia.clase != null and asistencia.clase.id == cl.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaClase">Fecha de la Clase <span class="required">*</span></label>
                <input type="date" name="fechaClase" id="fechaClase" th:value="${asistencia.fechaClase}" required />
            </div>

            <div class="form-group">
                <label for="registro">Fecha / Hora de Registro <span class="required">*</span></label>
                <input type="datetime-local" name="registro" id="registro" th:value="${asistencia.registro}" required />
            </div>

            <div class="form-actions">
                <a th:href="@{/asistencias/listar}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-guardar">Guardar Registro</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const regInput = document.getElementById('registro');
        if (regInput && !regInput.value) {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            regInput.value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        }
    });
</script>
</body>
</html>
