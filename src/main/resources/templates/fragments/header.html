<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<!-- Fragmento del HEAD -->
<head th:fragment="estilos-globales">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Escuela Kenpo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>

<body>

<header th:fragment="menu-navegacion">
    <nav class="navbar">
        <a th:href="@{/}" class="navbar-logo">Escuela Kenpo</a>

        <ul class="navbar-links">
            <!-- Todos los roles autenticados ven Estudiantes -->
            <li sec:authorize="isAuthenticated()"><a th:href="@{/estudiantes/listar}">Estudiantes</a></li>
            <!-- Solo ADMIN e INSTRUCTOR ven Instructores, Clases y Asistencias -->
            <li sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN','ROL_INSTRUCTOR')"><a th:href="@{/instructores/listar}">Instructores</a></li>
            <li sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN','ROL_INSTRUCTOR')"><a th:href="@{/clases/listar}">Clases</a></li>
            <li sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN','ROL_INSTRUCTOR')"><a th:href="@{/asistencias/listar}">Asistencias</a></li>
            <!-- Solo ADMIN ve Grados y Usuarios -->
            <li sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')"><a th:href="@{/grados}">Grados</a></li>
            <li sec:authorize="hasAnyAuthority('ROL_ADMIN','ROL_SUPERADMIN')"><a th:href="@{/admin/usuarios}">Usuarios</a></li>
            <li>
                <button type="button" id="theme-toggle" class="btn-theme">🌓 Modo</button>
            </li>
            <li sec:authorize="isAuthenticated()" class="navbar-session">
                <span class="navbar-user" sec:authentication="name">Usuario</span>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-logout">Cerrar sesión</button>
                </form>
            </li>
        </ul>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark-mode');
                    if (document.documentElement.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                    } else {
                        localStorage.setItem('theme', 'light');
                    }
                });
            }
        });
    </script>
</header>
</body>
</html>
