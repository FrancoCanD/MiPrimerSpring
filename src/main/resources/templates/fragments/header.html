<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Fragmento del HEAD (el que enlaza el CSS, creado en el paso anterior) -->
<head th:fragment="estilos-globales">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Escuela Kenpo</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>

<body>
<!-- NUEVO: Fragmento del Navbar para reutilizar en el Body -->
<header th:fragment="menu-navegacion">
    <nav class="navbar">
        <!-- Logo o Nombre del Sistema con enlace al Index -->
        <a th:href="@{/}" class="navbar-logo">Escuela Kenpo</a>

        <!-- Enlaces de navegación a tus módulos -->
        <ul class="navbar-links">
            <li><a th:href="@{/estudiantes/listar}">Estudiantes</a></li>
            <li><a th:href="@{/instructores/listar}">Instructores</a></li>
            <li><a th:href="@{/clases/listar}">Clases</a></li>
            <li><a th:href="@{/asistencias/listar}">Asistencias</a></li>
        </ul>
    </nav>
</header>
</body>
</html>
