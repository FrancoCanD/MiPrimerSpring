<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Clases — Kenpo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }

        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1e293b; margin: 0; font-size: 1.8rem; }

        .btn-crear { padding: 10px 18px; background-color: #f59e0b; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background-color 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .btn-crear:hover { background-color: #d97706; }
        .btn-inicio { padding: 10px 18px; background-color: white; color: #475569; text-decoration: none; border-radius: 6px; font-weight: 600; border: 1px solid #cbd5e1; transition: all 0.2s; font-size: 0.95rem; }
        .btn-inicio:hover { background-color: #f8fafc; border-color: #94a3b8; }

        /* Estilos de Tabla */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        th { background-color: #1e293b; color: white; text-align: left; padding: 14px 18px; font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        /* Badges de Estado */
        .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-activa { background-color: #d1fae5; color: #065f46; }
        .badge-inactiva { background-color: #e2e8f0; color: #475569; }

        /* Enlaces de Acción */
        .actions-cell a { text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.2s; }
        .link-editar { color: #3b82f6; margin-right: 12px; }
        .link-editar:hover { color: #1d4ed8; text-decoration: underline; }
        .link-eliminar { color: #ef4444; }
        .link-eliminar:hover { color: #b91c1c; text-decoration: underline; }

        .empty-msg { text-align: center; padding: 30px; background: white; border-radius: 10px; color: #64748b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div>
            <h1>Listado de Clases Impartidas</h1>
        </div>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/}" class="btn-inicio">🏠 Menú Principal</a>
            <a th:href="@{/clases/nuevo}" class="btn-crear">➕ Nueva Clase</a>
        </div>
    </div>

    <table th:if="${not #lists.isEmpty(clases)}">
        <thead>
        <tr>
            <th style="width: 80px;">ID</th>
            <th style="width: 200px;">Tipo de Clase</th>
            <th>Descripción del Módulo</th>
            <th style="width: 120px;">Estado</th>
            <th style="width: 150px;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="clase : ${clases}">
            <td th:text="${clase.id}" style="font-weight: 600; color: #64748b;"></td>
            <td th:text="${clase.tipoClase}" style="font-weight: 600; color: #1e293b;"></td>
            <td th:text="${clase.descripcion}"></td>
            <td>
                <span th:class="${clase.estado} ? 'badge badge-activa' : 'badge badge-inactiva'"
                      th:text="${clase.estado} ? 'Activa' : 'Inactiva'">
                </span>
            </td>
            <td class="actions-cell">
                <a th:href="@{/clases/editar/{id}(id=${clase.id})}" class="link-editar">Editar</a>
                <a th:href="@{/clases/eliminar/{id}(id=${clase.id})}"
                   class="link-eliminar"
                   onclick="return confirm('¿Seguro que deseas eliminar este bloque de clase?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-msg" th:if="${#lists.isEmpty(clases)}">
        ℹ️ No existen módulos de clases registrados en la academia actualmente.
    </div>
</div>

</body>
</html>
