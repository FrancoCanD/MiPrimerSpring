<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clases</title>
</head>
<body>

<h1>Listado de Clases Kenpo</h1>

<p>
    <a th:href="@{/clases/nuevo}">Crear nueva clase</a> |

</p>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tipo de Clase</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${clases}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.tipoClase}"></td>
        <td th:text="${c.descripcion}"></td>
        <td th:text="${c.estado ? 'Activa' : 'Inactiva'}"></td>
        <td>
            <a th:href="@{/clases/editar/{id}(id=${c.id})}">Editar</a> |
            <a th:href="@{/clases/eliminar/{id}(id=${c.id})}"
               onclick="return confirm('¿Desea eliminar esta clase?')">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(clases)}">No existen clases registradas en el sistema.</p>
<br>
<br>
<a th:href="@{/}">Volver al Inicio</a>
</body>
</html>
