<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Estudiante</title>
</head>
<body>

<h1 th:text="${estudiante.id == null ? 'Nuevo estudiante' : 'Editar estudiante'}"></h1>

<form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">

    <!-- Campo oculto para mantener el ID cuando se edita -->
    <input type="hidden" th:field="*{id}">

    <div>
        <label>Nombres:</label>
        <input type="text" th:field="*{nombres}">
        <span style="color:red;" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>
    </div>

    <div>
        <label>Apellido 1:</label>
        <input type="text" th:field="*{apellido1}">
        <span style="color:red;" th:if="${#fields.hasErrors('apellido1')}" th:errors="*{apellido1}"></span>
    </div>

    <div>
        <label>Apellido 2:</label>
        <input type="text" th:field="*{apellido2}">
        <span style="color:red;" th:if="${#fields.hasErrors('apellido2')}" th:errors="*{apellido2}"></span>
    </div>

    <div>
        <label>Fecha de Nacimiento:</label>
        <input type="date" th:field="*{fechaNac}">
        <span style="color:red;" th:if="${#fields.hasErrors('fechaNac')}" th:errors="*{fechaNac}"></span>
    </div>

    <div>
        <label>Rut:</label>
        <input type="text" th:field="*{rut}">
        <span style="color:red;" th:if="${#fields.hasErrors('rut')}" th:errors="*{rut}"></span>
    </div>

    <!-- ✅ SELECT en lugar de input text: envía el objeto Grado completo por su ID -->
    <div>
        <label>Grado:</label>
        <select th:field="*{grado}">
            <option value="">-- Seleccione un grado --</option>
            <option th:each="g : ${grados}"
                    th:value="${g.id}"
                    th:text="${g.nombre}">
            </option>
        </select>
        <span style="color:red;" th:if="${#fields.hasErrors('grado')}" th:errors="*{grado}"></span>
    </div>

    <div>
        <label>Fecha Ascenso:</label>
        <input type="date" th:field="*{fechaAscenso}">
        <span style="color:red;" th:if="${#fields.hasErrors('fechaAscenso')}" th:errors="*{fechaAscenso}"></span>
    </div>

    <div>
        <label>Activo:</label>
        <input type="checkbox" th:field="*{activo}">
    </div>

    <br>
    <button type="submit">Guardar</button>
    <a th:href="@{/estudiantes}">Volver</a>

</form>

</body>
</html>
