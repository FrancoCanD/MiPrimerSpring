<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Estudiante</title>
</head>
<body>

<h1 th:text="${estudiante.id == null ? 'Nuevo Estudiante' : 'Editar Estudiante'}"></h1>

<form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">

    <input type="hidden" th:field="*{id}">

    <!-- Campos heredados de Persona -->
    <div>
        <label>Rut (Sin puntos y con guión):</label>
        <input type="text" th:field="*{rut}" required>
    </div>
    <br>
    <div>
        <label>Nombres:</label>
        <input type="text" th:field="*{nombres}" required>
    </div>
    <br>
    <div>
        <label>Primer Apellido:</label>
        <input type="text" th:field="*{apellido1}" required>
    </div>
    <br>
    <div>
        <label>Segundo Apellido:</label>
        <input type="text" th:field="*{apellido2}">
    </div>
    <br>
    <div>
        <label>Fecha de Nacimiento:</label>
        <input type="date" th:field="*{fechaNac}" required>
    </div>
    <br>

    <!-- Campos específicos de Estudiante -->
    <div>
        <label>Fecha de Ascenso:</label>
        <input type="date" th:field="*{fechaAscenso}" required>
    </div>
    <br>
    <div>
        <label>Estado Activo:</label>
        <input type="checkbox" th:field="*{activo}">
    </div>
    <br>

    <!-- Selector de Grado (Vinculado al ID del grado) -->
    <div>
        <label>Grado / Cinturón:</label>
        <select th:field="*{grado.id}" required>
            <option value="">-- Seleccione Grado --</option>
            <!-- Debes inyectar 'grados' desde el EstudianteController -->
            <option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nombre}"></option>
        </select>
    </div>
    <br>

    <button type="submit">Guardar Estudiante</button>
    <a th:href="@{/estudiantes}">Cancelar</a>
</form>

</body>
</html>
