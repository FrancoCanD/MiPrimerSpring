<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/header :: estilos-globales}"></head>
<body>
<header th:insert="~{fragments/header :: menu-navegacion}"></header>
<br><br>

<div class="container-vista-estudiantes">
    <div class="container">

        <div class="header-section">
            <div>
                <h1>📋 Asistencias del Estudiante</h1>
                <p style="color:#64748b; margin-top:0.25rem;">
                    <strong th:text="${estudiante.nombres + ' ' + estudiante.apellido1}"></strong>
                    &nbsp;|&nbsp; RUT: <span th:text="${estudiante.rut}"></span>
                </p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <!-- Navega a perfil con el mismo RUT, sin volver a buscarlo -->
                <a th:href="@{/estudiantes/perfil(rut=${rut})}" class="btn-crear">👤 Ver Perfil</a>

                <a th:href="@{/estudiantes/listar}" class="btn-inicio">← Listado</a>
            </div>
        </div>

        <!-- Tabla de asistencias -->
        <table th:if="${not #lists.isEmpty(asistencias)}">
            <thead>
            <tr>
                <th>#</th>
                <th>Fecha de Clase</th>
                <th>Instructor</th>
                <th>Módulo / Clase</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="asistencia, iterStat : ${asistencias}">
                <td th:text="${iterStat.count}" style="color:#64748b; font-weight:600;"></td>
                <td th:text="${#temporals.format(asistencia.fechaClase, 'dd/MM/yyyy')}"></td>
                <td th:text="${asistencia.instructor.nombres + ' ' + asistencia.instructor.apellido1}"></td>
                <td th:text="${asistencia.clase.tipoClase}"></td>
            </tr>
            </tbody>
        </table>

        <!-- Mensaje si no tiene asistencias -->
        <div class="empty-msg" th:if="${#lists.isEmpty(asistencias)}">
            Este estudiante no tiene asistencias registradas.
        </div>

        <!-- Resumen -->
        <div th:if="${not #lists.isEmpty(asistencias)}"
             style="margin-top:1rem; color:#64748b; font-size:0.9rem;">
            Total de asistencias: <strong th:text="${#lists.size(asistencias)}"></strong>
        </div>

    </div>
</div>

<br><br>
<div th:replace="~{fragments/footer :: pie-pagina}"></div>
</body>
</html>
